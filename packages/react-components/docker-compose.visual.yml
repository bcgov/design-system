# Pinned environment for visual regression tests, so screenshots render
# identically on every machine. Keep the image tag in sync with `playwright`
# in package.json and the visual tests job in
# .github/workflows/test_react_component_library.yaml.
services:
  visual:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /app
    volumes:
      - .:/app:z
      # Keep Linux node_modules separate from the host's
      - visual_node_modules:/app/node_modules
    environment:
      - CI=true
    ipc: host

volumes:
  visual_node_modules:
