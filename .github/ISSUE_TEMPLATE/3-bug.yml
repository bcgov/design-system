name: Bug
description: Report an error or unexpected behaviour in a component
labels: ["bug"]
projects: ["bcgov/121"]
assignees:
  - mkernohanbc
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much information as possible, including screenshots if possible.
  - type: input
    id: component
    attributes:
      label: Component
      description: Which component does this bug affect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the actual behaviour and its impact. Add screenshots or recordings if useful.
      placeholder: What did you observe?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe the expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the steps or example needed to reproduce the issue.
      placeholder: 1. Go to… 2. Do… 3. Observe…
    validations:
      required: true
  - type: input
    id: technical
    attributes:
      label: Environment
      description: Component/package version, browser and version, operating system, or device (as relevant)
