name: New component
description: Propose a new component to be added to the design system
labels: ["component"]
projects: ["bcgov/121"]
assignees:
  - mkernohanbc
body:
  - type: markdown
    attributes:
      value: |
        We evaluate prospective new components based on:
        * Demonstrable impact in terms of functionality or usability of government digital service
        * Evidence that the functional need can't be met using existing components
        * Demand from the user community
  - type: input
    id: name
    attributes:
      label: Component name
      description: A short, descriptive name for this component
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the component, its expected behaviour, and the use cases it would support
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Explain the user need, the impact on government digital services, and why existing components do not meet the need
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Supporting information
      description: Include relevant examples, research, designs, or related discussions. If you have none, explain what you have considered so far.
    validations:
      required: true
