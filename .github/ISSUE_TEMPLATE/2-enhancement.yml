name: Enhancement
description: Suggest a change to how an existing component looks or behaves
labels: ["enhancement"]
projects: ["bcgov/121"]
assignees:
  - mkernohanbc
body:
  - type: markdown
    attributes:
      value: |
        We evaluate prospective enhancements based on:
        * Demonstrable impact in terms of functionality or usability of government digital service
        * Technical complexity and impact on existing services
        * Demand from the user community
  - type: input
    id: name
    attributes:
      label: Related component
      description: Which component does this proposed enhancement affect?
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the user need and the proposed change to the component's appearance or behaviour
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Explain the expected benefit to users and any impact on existing services
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Alternatives and supporting information
      description: Describe alternatives considered and include relevant examples, research, or designs. If you have none, explain what you have considered so far.
    validations:
      required: true
