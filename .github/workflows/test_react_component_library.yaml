name: Test React components library
permissions:
  contents: read

on:
  pull_request:
    paths:
      - packages/react-components/**
  workflow_dispatch:

# Cancel any currently running builds to save GitHub Actions hours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest-unit-tests:
    name: Vitest unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read .nvmrc
        run: echo "GITHUB_NVMRC_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV
        working-directory: ./packages/react-components

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.GITHUB_NVMRC_VERSION }}

      - name: Install dependencies
        run: npm install
        working-directory: ./packages/react-components

      # Errors in lint process will cause this job to fail
      - name: Lint
        run: npm run lint
        working-directory: ./packages/react-components

      # Errors in Prettier format check will cause this job to fail
      - name: Prettier format check
        run: npm run format:check
        working-directory: ./packages/react-components

      - name: Run test suite
        run: npm run test
        working-directory: ./packages/react-components

      # Treat failures in the Vite build as test failures.
      # We don't need to keep the artifact of this build,
      # we just care that it completes successfully.
      - name: Run Vite build
        run: npm run vite-build
        working-directory: ./packages/react-components

      # Treat failures in the main build script as test failures
      - name: Run build
        run: npm run build
        working-directory: ./packages/react-components

      # The library build strips types without checking them
      - name: Type check library
        run: npm run typecheck
        working-directory: ./packages/react-components

  playwright-accessibility-tests:
    name: Playwright accessibility tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read .nvmrc
        run: echo "GITHUB_NVMRC_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV
        working-directory: ./packages/react-components

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.GITHUB_NVMRC_VERSION }}

      - name: Install dependencies
        run: npm install
        working-directory: ./packages/react-components

      - name: Install Playwright
        run: npx playwright install --with-deps
        working-directory: ./packages/react-components

      - name: Run accessibility tests
        run: npm run test-storybook
        working-directory: ./packages/react-components

  visual-regression-tests:
    name: Visual regression tests
    runs-on: ubuntu-latest
    # Same image as docker-compose.visual.yml, so screenshots match the
    # committed baselines. Keep the tag in sync with `playwright` in
    # package.json (excluded from Dependabot for this reason).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: npm ci
        working-directory: ./packages/react-components

      - name: Run visual regression tests
        run: >-
          npx vitest --project=visual --watch=false
          --reporter=default --reporter=github-actions
          --reporter=./scripts/visual-reporter.ts
        working-directory: ./packages/react-components

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: packages/react-components/.vitest/attachments/
          retention-days: 14
